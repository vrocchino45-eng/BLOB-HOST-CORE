<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOB GSL-4E1A Bounded Explorer</title><style>body{background:#0b1621;color:#d9f0f5;font:15px system-ui;margin:20px auto;max-width:840px}canvas{width:100%;background:#102637;border:1px solid #496a79;border-radius:12px}button{background:#24495b;color:white;border:1px solid #6d9bad;border-radius:8px;padding:10px;margin:5px}code{color:#9cdeef}</style><h2>GSL-4E1A · Bounded Explorer</h2><p>Controller decisions are isolated; the orb below follows targets through a provisional GSL-4C-style fixed-step damped motion. No gameplay integration.</p><canvas id="scene" width="800" height="390"></canvas><div><button data-action="idle">Clear</button><button data-action="curiosity">Interest</button><button data-action="support">Support needed</button><button data-action="concern">Unexpected loss</button><button data-action="intentional">Deliberate release</button></div><p id="status"></p><script type="module">
import {createBoundedExplorer} from './GSL4E1A_BoundedExplorer.mjs';
const c=createBoundedExplorer(), canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'), status=document.querySelector('#status');const core={x:340,y:235},interest={x:650,y:115};let mode='idle',guide={x:450,y:145,vx:0,vy:0},elapsed=0;
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.action;elapsed=0;});
function frame(){elapsed+=10;const active=elapsed<1500;const signals={core,guidePosition:guide,guideVelocity:{x:guide.vx,y:guide.vy},interest:mode==='curiosity'?interest:null,supportNeeded:mode==='support',unexpectedLoss:mode==='concern'&&active,intentionalRelease:mode==='intentional'&&active};const r=c.step(10,signals);
// Fixed 10ms GSL-4C provisional integration; ownership is separate from controller.
const p={idle:[.006,.23,.40,3.4],curiosity:[.007,.24,.46,4.2],support:[.006,.29,.36,3.6],concern:[.015,.19,1,6.8]}[r.state];let ax=(r.target.x-guide.x)*p[0]-guide.vx*p[1],ay=(r.target.y-guide.y)*p[0]-guide.vy*p[1];ax=Math.max(-p[2],Math.min(p[2],ax));ay=Math.max(-p[2],Math.min(p[2],ay));guide.vx+=ax;guide.vy+=ay;const speed=Math.hypot(guide.vx,guide.vy);if(speed>p[3]){guide.vx*=p[3]/speed;guide.vy*=p[3]/speed;}guide.x+=guide.vx;guide.y+=guide.vy;
ctx.clearRect(0,0,800,390);ctx.strokeStyle='#35596c';ctx.setLineDash([5,7]);ctx.beginPath();ctx.arc(core.x,core.y,165,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#315e73';ctx.beginPath();ctx.arc(core.x,core.y,38,0,7);ctx.fill();ctx.fillStyle='#c3eaf3';ctx.font='13px system-ui';ctx.fillText('CORE',core.x-18,core.y+5);ctx.fillStyle='#47768b';ctx.beginPath();ctx.arc(interest.x,interest.y,13,0,7);ctx.fill();ctx.fillText('Host signal',interest.x-32,interest.y-22);ctx.strokeStyle='#4f8499';ctx.beginPath();ctx.moveTo(guide.x,guide.y);ctx.lineTo(r.target.x,r.target.y);ctx.stroke();ctx.shadowColor='#8ef0ff';ctx.shadowBlur=22;ctx.fillStyle='#9ee9f5';ctx.beginPath();ctx.arc(guide.x,guide.y,12,0,7);ctx.fill();ctx.shadowBlur=0;status.textContent=`Mode: ${mode} · Behavior: ${r.state} · Attention: ${r.attention} · Range warning: ${r.returnRequested} · Time: ${(elapsed/1000).toFixed(1)}s`;requestAnimationFrame(frame)}frame();
</script></html>
