name: BLOB CI08 IN02 deterministic verification
on:
  push:
    branches: [candidate/ci08-in04-c1]
permissions:
  contents: read
jobs:
  node-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Install from the committed lockfile
        run: node scripts/ci08-verify.mjs --install
      - name: Run runtime, numerical and pinned Director verification
        run: |
          git worktree add --detach "$RUNNER_TEMP/blob-wave09-in01" 462f1278ea069b41b4c0216335f4bb9363ee38af
          git worktree add --detach "$RUNNER_TEMP/blob-wave10-ui03-rev3" 133c979aa0fd420eeede40d51df55c7bda668663
          git worktree add --detach "$RUNNER_TEMP/blob-wave10-in02-rev4" 85b2b2732321646d0b9eed9fc159b72b87dff790
          git worktree add --detach "$RUNNER_TEMP/blob-wave11-pi05-rev5" 0ce25cb38a303a63bcb86adb3be6c820fcde182f
          git worktree add --detach "$RUNNER_TEMP/blob-wave12-in03-rev6" cb4b746f4e677e8bc104b9bdd42eb8de4029980f
          node scripts/ci08-verify.mjs CI08_RESULTS --numerical "$RUNNER_TEMP/blob-wave09-in01" "$RUNNER_TEMP/blob-wave10-ui03-rev3" "$RUNNER_TEMP/blob-wave10-in02-rev4" "$RUNNER_TEMP/blob-wave11-pi05-rev5" "$RUNNER_TEMP/blob-wave12-in03-rev6"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blob-ci08-deterministic-${{ github.sha }}
          path: |
            CI08_RESULTS/*.log
            CI08_RESULTS/summary.json
            CI08_RESULTS/mounted.json
            CI08_RESULTS/pi05-mounted.json
            CI08_RESULTS/pi06-mounted.json
          if-no-files-found: warn
          retention-days: 14
